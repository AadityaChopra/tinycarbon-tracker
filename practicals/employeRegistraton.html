<!DOCTYPE html>
<html>

<head>
    <title>Employee Registration Form</title>
</head>

<body style="background-color: bisque;">
    <h2><u>Employee Registration Form</u></h2>

    <form>

        <label for="ename">Full Name:</label>
        <input type="text" id="ename" name="empname" placeholder="Enter your name" required><br><br>

        <label for="eid">Employee ID:</label>
        <input type="text" id="eid" name="empid" placeholder="e.g. EMP123" required><br><br>

        <label for="pwd">Create Password:</label>
        <input type="password" id="pwd" name="password" placeholder="Enter password" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male"> <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="dept">Choose Department:</label>
        <select id="dept" name="dept">
            <option value="">--Select--</option>
            <option value="HR">Human Resources</option>
            <option value="IT">Information Technology</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Sales">Sales</option>
        </select><br><br>

        <label>Technical Skills:</label><br>
        <input type="checkbox" id="java" name="skills" value="java"> <label for="java">Java</label>
        <input type="checkbox" id="c/cpp" name="skills" value="c/cpp"> <label for="c/cpp">C/C++</label>
        <input type="checkbox" id="html" name="skills" value="html"> <label for="html">HTML</label>
        <input type="checkbox" id="python" name="skills" value="python"> <label for="python">Python</label><br><br>

        <label for="addr">Residential Address:</label><br>
        <textarea id="addr" rows="4" cols="35" name="address" placeholder="Enter full address"></textarea><br><br>

        <label for="mail">Email Address:</label>
        <input type="email" id="mail" name="email" placeholder="example@mail.com"><br><br>

        <label for="phone">Contact Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit number" pattern="[0-9]{10}"><br><br>

        <input type="submit" value="Submit Form">
        <input type="reset" value="Reset All">
    </form>

</body>

</html>
