<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Aadi's Online Bookstore</title>
    <style>
        body {
            background-color: bisque;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        form {
            background-color: #fff8dc;
            border: 2px solid #8B4513;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }
        input[type="submit"] {
            padding: 8px 20px;
            background-color: #8B4513;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        input[type="submit"]:hover {
            background-color: #a0522d;
        }
        .msg {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Login</h2>
    <form onsubmit="return checkLogin(event)">
        <label>Username:</label><br>
        <input type="text" id="username"><br>
        <label>Password:</label><br>
        <input type="password" id="password"><br><br>
        <input type="submit" value="Login">
    </form>
    <div class="msg" id="msg"></div>

    <script>
        function checkLogin(event) {
            event.preventDefault(); // stop refresh
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            // static demo login (username: aadi, password: 1234)
            if (user === "aadi" && pass === "1234") {
                document.getElementById("msg").style.color = "green";
                document.getElementById("msg").innerText = "✅ Login Successful! Redirecting...";
                
                // after 1 second go to homepage
                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1000);
            } else {
                document.getElementById("msg").style.color = "red";
                document.getElementById("msg").innerText = "❌ Invalid Username or Password";
            }
        }
    </script>
</body>
</html>
