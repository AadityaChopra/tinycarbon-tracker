<!DOCTYPE html>
<html>
<head>
    <title>Background Color Changer</title>

    <style>
        body {
            text-align: center;
            padding-top: 50px;
            font-family: Arial;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #ff0703;
            color: white;
            border: none;
            border-radius: 8px;
        }

        button:hover {
            background: #bf692c;
        }
    </style>
</head>

<body>

<h2>Click the Button to Change Background Color</h2>

<button onclick="changeColor()">Change Color</button>

<script>
    function changeColor() {
        // Array of colours
        const colors = ["pink", "yellow", "black", "silver", "brown"];

        // Pick a random colour
        const randomColor = colors[Math.floor(Math.random() * colors.length)];

        // Apply the colour to background
        document.body.style.backgroundColor = randomColor;
    }
</script>

</body>
</html>
