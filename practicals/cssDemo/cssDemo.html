<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Demo</title>
    <link rel="stylesheet" href="style.css">

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        text-align: center;
    }


    h1 {
        color: #2c3e50;
    }


    .internal-box {
        background-color: #e3f2fd;
        border: 2px solid #2196f3;
        padding: 15px;
        margin: 15px auto;
        width: 50%;
        border-radius: 8px;
    }
    </style>
</head>
<body>
    <h1>Types of CSS</h1>

    <div class="external-box">
    <h2>1) External CSS</h2>
    <p>This box is styled using <strong>external CSS</strong>.</p>
    </div>


    <div class="internal-box">
    <h2>2) Internal CSS</h2>
    <p>This box is styled using <strong>internal CSS</strong>.</p>
    </div>


    <div style="background-color:#fff3cd; border:2px solid #ffc107; padding:15px; width:50%; margin:15px auto; border-radius:8px;">
    <h2>3) Inline CSS</h2>
    <p>This box is styled using <strong>inline CSS</strong>.</p>
    </div>
</body>
</html>
